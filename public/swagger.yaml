                task_id:
                  type: integer
                  example: 123
                column_id:
                  type: integer
                  example: 2
      responses:
        '200':
          description: Задача перемещена
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  task:
                    $ref: '#/components/schemas/Task'

