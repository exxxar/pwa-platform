      responses:
        '200':
          description: Порядок изменён

  # ==========================================
  # ЗАДАЧИ (TASKS)
  # ==========================================
  /boards/{uuid}/tasks:
    get:
      tags: [Tasks]
      summary: Получить все задачи доски
      operationId: getBoardTasks
      parameters:
        - $ref: '#/components/parameters/BoardUuid'
      responses:
        '200':
          description: Список задач
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'

    post:
      tags: [Tasks]
      summary: Создать новую задачу
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/BoardUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  task:
                    $ref: '#/components/schemas/Task'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Получить задачу по ID
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  task:
                    $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Tasks]
      summary: Обновить задачу
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                priority:
                  type: string
                  enum: [low, medium, high]
                due_date:
                  type: string
                  format: date
                  nullable: true
                labels:
                  type: array
                  items:
                    type: string
                tag_ids:
                  type: array
                  items:
                    type: integer
                subtasks:
                  type: array
                  items:
                    type: object
                custom_data:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  task:
                    $ref: '#/components/schemas/Task'

    delete:
      tags: [Tasks]
      summary: Удалить задачу
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Задача удалена
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Task deleted"

  /tasks/{taskId}/duplicate:
    post:
      tags: [Tasks]
      summary: Дублировать задачу
      operationId: duplicateTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '201':
          description: Задача дублирована
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  task:
                    $ref: '#/components/schemas/Task'

  /tasks/{taskId}/view:
    post:
      tags: [Tasks]
      summary: Отметить задачу как просмотренную
      operationId: markTaskViewed
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Задача отмечена
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
