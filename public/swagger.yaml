                  message:
                    type: string
                    example: "Marked 5 messages as read"
                  updated_count:
                    type: integer
                    example: 5

  /messages/{messageId}/read:
    post:
      tags: [Messages]
      summary: Отметить сообщение как прочитанное
      operationId: markMessageRead
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Сообщение отмечено
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    $ref: '#/components/schemas/Message'

  /messages/{messageId}:
    put:
      tags: [Messages]
      summary: Обновить сообщение
