  # ==========================================
  /tasks/{taskId}/messages:
    get:
      tags: [Messages]
      summary: Получить все сообщения задачи
      operationId: getMessages
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Список сообщений
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'

    post:
      tags: [Messages]
      summary: Отправить сообщение
      description: |
        Отправка сообщения с опциональными файлами.
        Используйте `multipart/form-data` для загрузки файлов.
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageCreate'
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Сообщение отправлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    $ref: '#/components/schemas/Message'

  /tasks/{taskId}/messages/read-all:
    post:
      tags: [Messages]
      summary: Отметить все сообщения как прочитанные
